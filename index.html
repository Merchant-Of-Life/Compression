<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="header">
            <h1>Image Compressor</h1>
            <p class="subtitle">A Website That Compresses Your images Locally</p>
        </header>

        <label for="imageinput" class="dropzone" id="dropzone">
            <p>Drag & Drop your image here or click to browse</p>
            <span class="browse-btn">Choose Files</span>
            <input type="file" id="imageinput" accept="image/*">
        </label>


        <div class="controls-card">
            <div class="slide-group">
               <label for="qualitySlider">Quality: <span id="qualityValue">50</span>%</label>
                <input type="range" id="qualitySlider" min="10" max="90" value="50">
            </div>
            <button id="compressBtn">Compress Image</button>
        </div>
        
        <div class="preview-card">
            <div class="info-row">
                <p id="fileinfo">No Image Selected Yet.</p>
                <p id="compressedInfo">Waiting to compress...</p>
            </div>
        </div>

        <div class="compare-box">
           <img id="preview" style="display: none;" alt="Original preview">
           <img id="compressedPreview" style="display: none;" alt="Compressed preview">
           <div class="divider" id="divider"></div>
        </div>

        <div class="slider-group">
            <div class="slider-labels">
                <span>Original</span>
                <span>Compressed</span>
            </div>
            <input type="range" id="compareSlider" min="0" max="100" value="50">
        </div>
         
        <a id="downloadBtn" style="display: none;">Download Image</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
